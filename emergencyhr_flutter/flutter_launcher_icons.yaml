# App icon. Run `dart run flutter_launcher_icons` after changing the images.
flutter_launcher_icons:
  image_path: assets/images/brand/app_icon.png
  android: true
  # Android adaptive icon: white cross over the emergency red.
  adaptive_icon_background: "#D92D20"
  adaptive_icon_foreground: assets/images/brand/app_icon_foreground.png
  # The foreground image already sits inside Android's safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  # iOS needs an opaque icon; fill the rounded corners with the same red.
  background_color_ios: "#D92D20"
  web:
    generate: true
    image_path: assets/images/brand/app_icon.png
    background_color: "#D92D20"
    theme_color: "#D92D20"
  macos:
    generate: true
    image_path: assets/images/brand/app_icon.png
  windows:
    generate: true
    image_path: assets/images/brand/app_icon.png
    icon_size: 256
